<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Management | NERD Clearance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/public.css" rel="stylesheet">
    <style>body{background:#f2f5f9}.staff-page{max-width:1180px;margin:auto;padding:32px 20px}.panel{border:1px solid var(--border);border-radius:14px;background:white}.panel-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.table-wrap{overflow:auto}.table{min-width:800px}.table td,.table th{font-size:13px}.admin-top{min-height:72px;background:var(--navy)}.permission-check{display:flex;align-items:center;gap:8px;margin:6px 0}</style>
  </head>
  <body>
    <nav class="navbar admin-top navbar-dark"><div class="container"><a class="navbar-brand d-flex align-items-center" href="/admin/dashboard"><span class="brand-mark">OJ</span><span class="brand-copy"><strong>OGAH JOHN BUSINESS CENTER</strong><small>UDUS MINI MART</small></span></a><a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a></div></nav>
    <main class="staff-page">
      <div class="panel">
        <div class="panel-header"><div><span class="section-kicker">Administration</span><h1 class="h4 mt-1 mb-0">Staff accounts and permissions</h1></div><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createStaffModal"><i class="bi bi-person-plus me-1"></i>Create staff</button></div>
        <div class="table-wrap"><table class="table mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="staffRows"><tr><td colspan="6" class="text-center py-5 text-secondary">Loading staff accounts...</td></tr></tbody></table></div>
      </div>
    </main>
    <div class="modal fade" id="createStaffModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="createStaffForm"><div class="modal-header"><h2 class="modal-title fs-5">Create staff account</h2><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body">
      <label class="form-label" for="staffFullName">Full name</label><input class="form-control mb-3" id="staffFullName" name="fullName" required>
      <label class="form-label" for="staffEmail">Email</label><input class="form-control mb-3" id="staffEmail" name="email" type="email" required>
      <label class="form-label" for="staffPhone">Phone</label><input class="form-control mb-3" id="staffPhone" name="phone" required>
      <label class="form-label" for="staffPassword">Password</label><input class="form-control" id="staffPassword" name="password" type="password" minlength="4" maxlength="72" required>
    </div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Create account</button></div></form></div></div>
    <div class="modal fade" id="permissionModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="permissionForm"><div class="modal-header"><h2 class="modal-title fs-5">Assign permissions</h2><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body" id="permissionChecks"></div><input type="hidden" id="permissionStaffId"><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save permissions</button></div></form></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let csrfToken="",availablePermissions=[],assignments=[];
      async function initialize(){
        const csrfResponse=await fetch("/api/csrf-token",{credentials:"same-origin"});csrfToken=(await csrfResponse.json()).csrfToken;
        await loadStaff();
      }
      async function loadStaff(){
        const response=await fetch("/api/admin/staff",{credentials:"same-origin"});
        if(!response.ok)throw new Error("Could not load staff accounts.");
        const data=await response.json();availablePermissions=data.permissions||[];assignments=data.assignments||[];
        document.getElementById("staffRows").innerHTML=data.staff.length?data.staff.map(staff=>`
          <tr><td><strong>${escapeHtml(staff.full_name)}</strong></td><td>${escapeHtml(staff.email)}</td><td>${escapeHtml(staff.phone)}</td>
          <td>${staff.is_active?"Active":"Inactive"}</td><td>${staff.last_login_at?new Date(staff.last_login_at).toLocaleString(): "Never"}</td>
          <td><div class="d-flex gap-1"><button class="btn btn-outline-primary btn-sm" type="button" onclick="openPermissions(${staff.id})">Permissions</button><button class="btn btn-outline-secondary btn-sm" type="button" onclick="toggleStaff(${staff.id},${staff.is_active?false:true})">${staff.is_active?"Deactivate":"Activate"}</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="text-center py-5 text-secondary">No staff accounts.</td></tr>`;
      }
      function escapeHtml(value){const el=document.createElement("span");el.textContent=value==null?"":String(value);return el.innerHTML;}
      async function toggleStaff(staffId,isActive){await submitJson(`/api/admin/staff/${staffId}`,{isActive},"PATCH");await loadStaff();}
      function openPermissions(staffId){
        document.getElementById("permissionStaffId").value=staffId;
        const granted=new Set(assignments.filter(item=>item.user_id===staffId).map(item=>item.name));
        document.getElementById("permissionChecks").innerHTML=availablePermissions.map(permission=>`<label class="permission-check"><input type="checkbox" name="permission" value="${escapeHtml(permission.name)}" ${granted.has(permission.name)?"checked":""}><span><strong>${escapeHtml(permission.name)}</strong><br><small class="text-secondary">${escapeHtml(permission.description||"")}</small></span></label>`).join("");
        bootstrap.Modal.getOrCreateInstance(document.getElementById("permissionModal")).show();
      }
      async function submitJson(url,payload,method="POST"){
        const response=await fetch(url,{method,credentials:"same-origin",headers:{ "Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({...payload,csrfToken})});
        const data=await response.json();if(!response.ok)throw new Error(data.error?.message||"Request failed.");return data;
      }
      document.getElementById("createStaffForm").addEventListener("submit",async(event)=>{event.preventDefault();try{await submitJson("/api/admin/staff",Object.fromEntries(new FormData(event.currentTarget).entries()));bootstrap.Modal.getInstance(document.getElementById("createStaffModal")).hide();event.currentTarget.reset();await loadStaff();}catch(error){alert(error.message);}});
      document.getElementById("permissionForm").addEventListener("submit",async(event)=>{event.preventDefault();try{const staffId=document.getElementById("permissionStaffId").value;const permissions=[...event.currentTarget.querySelectorAll("[name=permission]:checked")].map(input=>input.value);await submitJson(`/api/admin/staff/${staffId}/permissions`,{permissions});bootstrap.Modal.getInstance(document.getElementById("permissionModal")).hide();await loadStaff();}catch(error){alert(error.message);}});
      initialize().catch(error=>alert(error.message));
    </script>
  </body>
</html>
