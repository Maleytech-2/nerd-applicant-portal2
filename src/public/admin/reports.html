<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports | NERD Clearance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/public.css" rel="stylesheet">
    <style>body{background:#f2f5f9}.report-page{max-width:1180px;margin:auto;padding:32px 20px}.panel{border:1px solid var(--border);border-radius:14px;background:white}.panel-header{padding:18px 20px;border-bottom:1px solid var(--border)}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}.filter-grid .form-control,.filter-grid .form-select{min-height:42px}.table-wrap{overflow:auto}.table{min-width:1050px}.table td,.table th{font-size:13px}.report-top{min-height:72px;background:var(--navy)}@media(max-width:991px){.filter-grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}@media(max-width:575px){.filter-grid{grid-template-columns:1fr}}</style>
  </head>
  <body>
    <nav class="navbar report-top navbar-dark"><div class="container"><a class="navbar-brand d-flex align-items-center" href="/admin/dashboard"><span class="brand-mark">OJ</span><span class="brand-copy"><strong>OGAH JOHN BUSINESS CENTER</strong><small>UDUS MINI MART</small></span></a><a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a></div></nav>
    <main class="report-page">
      <div class="panel">
        <div class="panel-header d-flex align-items-center justify-content-between flex-wrap gap-2"><div><span class="section-kicker">Reporting</span><h1 class="h4 mt-1 mb-0">Applicant and registration reports</h1></div><button class="btn btn-primary btn-sm" id="exportButton" type="button"><i class="bi bi-file-earmark-excel me-1"></i>Export Excel</button></div>
        <form class="p-3 border-bottom" id="filterForm">
          <div class="filter-grid">
            <div><label class="form-label">Applicant name</label><input class="form-control" name="name"></div>
            <div><label class="form-label">Application reference</label><input class="form-control" name="applicationReference"></div>
            <div><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
            <div><label class="form-label">Email</label><input class="form-control" name="email"></div>
            <div><label class="form-label">Nationality</label><input class="form-control" name="nationality"></div>
            <div><label class="form-label">Institution</label><input class="form-control" name="institution"></div>
            <div><label class="form-label">Department</label><input class="form-control" name="department"></div>
            <div><label class="form-label">Payment status</label><select class="form-select" name="paymentStatus"><option value="">All</option><option>pending_verification</option><option>under_review</option><option>approved</option><option>rejected</option><option>correction_required</option></select></div>
            <div><label class="form-label">Application status</label><select class="form-select" name="applicationStatus"><option value="">All</option><option>draft</option><option>submitted</option><option>under_review</option><option>correction_required</option><option>approved_internally</option><option>ready_for_nerd_registration</option><option>nerd_registration_in_progress</option><option>nerd_registration_completed</option><option>clearance_available</option></select></div>
            <div><label class="form-label">From date</label><input class="form-control" name="from" type="date"></div>
            <div><label class="form-label">To date</label><input class="form-control" name="to" type="date"></div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-3"><button class="btn btn-outline-secondary btn-sm" type="reset">Clear</button><button class="btn btn-primary btn-sm" type="submit">Search reports</button></div>
        </form>
        <div class="table-wrap"><table class="table mb-0"><thead><tr><th>Applicant</th><th>Reference</th><th>Nationality</th><th>Institution</th><th>Eligibility</th><th>Payment</th><th>Application</th><th>NERD progress</th><th>Clearance</th></tr></thead><tbody id="reportRows"><tr><td colspan="9" class="text-center py-5 text-secondary">Loading reports...</td></tr></tbody></table></div>
        <div class="d-flex justify-content-between align-items-center p-3"><button class="btn btn-outline-secondary btn-sm" id="previousPage" type="button">Previous</button><span class="small text-secondary" id="pageLabel"></span><button class="btn btn-outline-secondary btn-sm" id="nextPage" type="button">Next</button></div>
      </div>
    </main>
    <script>
      let csrfToken="",currentPage=1,latestFilters={};
      function escapeHtml(value){const el=document.createElement("span");el.textContent=value==null?"":String(value);return el.innerHTML;}
      async function initialize(){const response=await fetch("/api/csrf-token",{credentials:"same-origin"});if(!response.ok){window.location.assign("/applicant/login");return;}csrfToken=(await response.json()).csrfToken;await loadReports();}
      async function loadReports(){
        const params=new URLSearchParams(latestFilters);params.set("page",String(currentPage));params.set("limit","20");
        const response=await fetch(`/api/reports?${params}`,{credentials:"same-origin"});
        if(!response.ok){const data=await response.json();throw new Error(data.error?.message||"Could not load reports.");}
        const data=await response.json();
        document.getElementById("reportRows").innerHTML=data.reports.length?data.reports.map(row=>`<tr><td><strong>${escapeHtml(row.full_name)}</strong><br><span class="text-secondary">${escapeHtml(row.email)}</span></td><td>${escapeHtml(row.application_reference||"")}</td><td>${escapeHtml(row.nationality||"")}</td><td>${escapeHtml(row.institution_name||"")}</td><td>${row.is_eligible?"Eligible":"—"}</td><td>${escapeHtml(row.payment_status||"Not paid")}</td><td>${escapeHtml(row.application_status||"Draft")}</td><td>${escapeHtml(row.nerd_registration_status||"Not started")}</td><td>${row.clearance_available?"Available":"Not available"}</td></tr>`).join(""):`<tr><td colspan="9" class="text-center py-5 text-secondary">No records match the filters.</td></tr>`;
        document.getElementById("pageLabel").textContent=`Page ${data.pagination.page} of ${data.pagination.pages||1} (${data.pagination.total} records)`;
        document.getElementById("previousPage").disabled=currentPage<=1;
        document.getElementById("nextPage").disabled=currentPage>=data.pagination.pages;
      }
      document.getElementById("filterForm").addEventListener("submit",async(event)=>{event.preventDefault();latestFilters=Object.fromEntries([...new FormData(event.currentTarget).entries()].filter(([,value])=>value));currentPage=1;try{await loadReports()}catch(error){alert(error.message)}});
      document.getElementById("filterForm").addEventListener("reset",()=>setTimeout(()=>{latestFilters={};currentPage=1;loadReports().catch(error=>alert(error.message));},0));
      document.getElementById("previousPage").addEventListener("click",()=>{currentPage--;loadReports().catch(error=>alert(error.message));});
      document.getElementById("nextPage").addEventListener("click",()=>{currentPage++;loadReports().catch(error=>alert(error.message));});
      document.getElementById("exportButton").addEventListener("click",async()=>{
        const button=document.getElementById("exportButton");button.disabled=true;
        try{
          const response=await fetch("/api/reports/excel",{method:"POST",credentials:"same-origin",headers:{ "Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify(latestFilters)});
          if(!response.ok){const data=await response.json();throw new Error(data.error?.message||"Export failed.");}
          const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=`nerd-clearance-report-${new Date().toISOString().slice(0,10)}.xlsx`;link.click();URL.revokeObjectURL(url);
        }catch(error){alert(error.message);}finally{button.disabled=false;}
      });
      initialize().catch(error=>alert(error.message));
    </script>
  </body>
</html>
