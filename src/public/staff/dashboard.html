<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Dashboard | NERD Clearance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/public.css" rel="stylesheet">
    <style>
      body{background:#f2f5f9}.staff-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
      .staff-sidebar{background:var(--navy);padding:24px 16px;color:white}.staff-sidebar .navbar-brand{margin-bottom:30px}
      .staff-menu{list-style:none;padding:0}.staff-menu a{display:flex;gap:9px;padding:11px;border-radius:8px;color:rgba(255,255,255,.72);text-decoration:none}
      .staff-menu a:hover{background:rgba(255,255,255,.08);color:var(--gold)}.staff-main{min-width:0}.staff-topbar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--border)}
      .staff-content{padding:28px}.staff-card{border:1px solid var(--border);border-radius:14px;padding:24px;background:white}.permission-list{display:flex;flex-wrap:wrap;gap:8px}.permission-chip{border-radius:999px;padding:7px 10px;background:#eef3f9;color:var(--navy);font-size:12px;font-weight:700}
      @media(max-width:767px){.staff-shell{grid-template-columns:1fr}.staff-sidebar{display:none}.staff-content{padding:16px}.staff-topbar{padding:0 16px}}
    </style>
  </head>
  <body>
    <div class="staff-shell">
      <aside class="staff-sidebar">
        <a class="navbar-brand d-flex align-items-center" href="/"><span class="brand-mark">OJ</span><span class="brand-copy"><strong>OGAH JOHN BUSINESS CENTER</strong><small>UDUS MINI MART</small></span></a>
        <ul class="staff-menu">
          <li><a href="#overview"><i class="bi bi-grid"></i>Overview</a></li>
          <li><a href="#applications"><i class="bi bi-file-earmark-text"></i>Applications</a></li>
          <li><a href="#documents"><i class="bi bi-folder"></i>Permitted documents</a></li>
          <li><a href="/admin/reports"><i class="bi bi-bar-chart"></i>Permitted reports</a></li>
        </ul>
      </aside>
      <main class="staff-main">
        <header class="staff-topbar"><strong id="staffName">Staff member</strong><button class="btn btn-outline-secondary btn-sm" id="logoutButton" type="button">Logout</button></header>
        <div class="staff-content">
          <div class="staff-card mb-4">
            <span class="section-kicker">Authorized workspace</span>
            <h1 class="h3 mt-2">Staff dashboard</h1>
            <p class="text-secondary">Available tools depend on permissions assigned by the administrator.</p>
            <div class="permission-list" id="permissionList"></div>
          </div>
          <div class="row g-3" id="accessCards"></div>
        </div>
      </main>
    </div>
    <script>
      let csrfToken="";
      (async()=>{
        const sessionResponse=await fetch("/api/session",{credentials:"same-origin"});
        if(!sessionResponse.ok){window.location.assign("/applicant/login");return;}
        const data=await sessionResponse.json();
        if(data.user.role!=="staff"){window.location.assign(data.user.role==="administrator"?"/admin/dashboard":"/applicant/dashboard");return;}
        document.getElementById("staffName").textContent=data.user.fullName;
        const permissions=data.user.permissions||[];
        document.getElementById("permissionList").innerHTML=permissions.length
          ?permissions.map(permission=>`<span class="permission-chip">${permission}</span>`).join("")
          :"<span class='text-secondary'>No individual permissions assigned.</span>";
        const cards=[
          ["applications.view","Application records","Review ordinary submitted applications.","#applications"],
          ["applications.correct","Corrections","Request authorized application corrections.","#applications"],
          ["documents.view","Documents","View documents that you are permitted to review.","#documents"],
          ["nerd.update","NERD progress","Update official registration progress.","#applications"],
          ["reports.view","Reports","Open permitted reports.","#reports"],
        ];
        document.getElementById("accessCards").innerHTML=cards.map(([permission,title,description,href])=>`
          <div class="col-md-6 col-xl-4"><div class="staff-card h-100"><h2 class="h6">${title}</h2><p class="small text-secondary">${description}</p>
          ${permissions.includes(permission)?`<a class="btn btn-primary btn-sm" href="${href}">Open</a>`:`<button class="btn btn-outline-secondary btn-sm" disabled>Permission required</button>`}</div></div>`).join("");
        const csrfResponse=await fetch("/api/csrf-token",{credentials:"same-origin"});
        csrfToken=(await csrfResponse.json()).csrfToken;
      })();
      document.getElementById("logoutButton").addEventListener("click",async()=>{
        const response=await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin",headers:{ "Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({csrfToken})});
        const data=await response.json();if(response.ok)window.location.assign(data.redirect);
      });
    </script>
  </body>
</html>
